<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CTF Security Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shield-alt"></i> CTF Security Lab</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/challenges">Challenges</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/docs">Docs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Profile Header -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-2 text-center">
                        <div class="avatar-lg mb-3 mb-md-0">
                            <i class="fas fa-user-circle fa-7x text-primary"></i>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <h2 class="mb-1" id="profileUsername">Loading...</h2>
                        <p class="text-muted mb-2" id="profileEmail">email@example.com</p>
                        <div class="d-flex gap-2">
                            <span class="badge bg-primary" id="profileRole">User</span>
                            <span class="badge bg-success" id="profileRank">#? Global</span>
                        </div>
                        <p class="mt-3 mb-0" id="profileBio">No bio yet...</p>
                    </div>
                    <div class="col-md-3 text-end">
                        <button class="btn btn-outline-primary mb-2" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                            <i class="fas fa-edit"></i> Edit Profile
                        </button>
                        <button class="btn btn-outline-danger" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-trophy fa-2x text-warning mb-2"></i>
                        <h3 class="text-primary mb-0" id="totalScore">0</h3>
                        <p class="text-muted mb-0">Total Score</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-flag fa-2x text-success mb-2"></i>
                        <h3 class="text-success mb-0" id="solvedChallenges">0</h3>
                        <p class="text-muted mb-0">Challenges Solved</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-award fa-2x text-info mb-2"></i>
                        <h3 class="text-info mb-0" id="badgesCount">0</h3>
                        <p class="text-muted mb-0">Badges Earned</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-fire fa-2x text-danger mb-2"></i>
                        <h3 class="text-danger mb-0" id="currentStreak">0</h3>
                        <p class="text-muted mb-0">Day Streak</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Recent Activity -->
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-history me-2"></i>Recent Activity</h5>
                    </div>
                    <div class="card-body">
                        <div id="activityList">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </div>

                <!-- Solved Challenges -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-check-circle me-2"></i>Solved Challenges</h5>
                    </div>
                    <div class="card-body">
                        <div id="solvedList" class="row g-3">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-md-4">
                <!-- Badges -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-medal me-2"></i>Badges</h5>
                    </div>
                    <div class="card-body">
                        <div id="badgesList" class="d-flex flex-wrap gap-3">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </div>

                <!-- Progress -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-chart-line me-2"></i>Progress</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <span>Overall Completion</span>
                                <span id="completionPercent">0%</span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar bg-success" id="completionBar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div id="categoryProgress">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label class="form-label">Bio</label>
                            <textarea class="form-control" id="editBio" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Website</label>
                            <input type="url" class="form-control" id="editWebsite">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">GitHub</label>
                            <input type="text" class="form-control" id="editGithub">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
        });

        async function loadProfile() {
            // Implementation in main.js
        }

        async function saveProfile() {
            // Implementation in main.js
        }
    </script>
</body>
</html>
