<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - CTF Security Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shield-alt"></i> CTF Security Lab</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/challenges">Challenges</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/leaderboard">Leaderboard</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-4 mb-2">🏆 Leaderboard</h1>
            <p class="lead text-muted">Top hackers competing for glory!</p>
        </div>

        <!-- Leaderboard Filters -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="timeframe" id="allTime" checked>
                <label class="btn btn-outline-primary" for="allTime">All Time</label>

                <input type="radio" class="btn-check" name="timeframe" id="thisMonth">
                <label class="btn btn-outline-primary" for="thisMonth">This Month</label>

                <input type="radio" class="btn-check" name="timeframe" id="thisWeek">
                <label class="btn btn-outline-primary" for="thisWeek">This Week</label>
            </div>

            <button class="btn btn-outline-primary" onclick="loadLeaderboard()">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <!-- Top 3 Podium -->
        <div class="row mb-5" id="podium">
            <!-- Dynamically loaded -->
        </div>

        <!-- Leaderboard Table -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-trophy me-2"></i>Rankings</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th width="80">Rank</th>
                                <th>Player</th>
                                <th width="120">Score</th>
                                <th width="120">Challenges</th>
                                <th width="200">Last Solve</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <!-- Dynamically loaded -->
                            <tr>
                                <td colspan="5" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3 text-muted">Loading leaderboard...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Your Rank (if logged in) -->
        <div class="card mt-4 d-none" id="yourRankCard">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h5 class="mb-1">Your Rank: <span class="text-primary" id="yourRank">#?</span></h5>
                        <p class="text-muted mb-0">
                            <span id="yourScore">0</span> points •
                            <span id="yourChallenges">0</span> challenges solved
                        </p>
                    </div>
                    <div class="col-md-4 text-end">
                        <a href="/profile" class="btn btn-primary">View Profile</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadLeaderboard();
        });

        async function loadLeaderboard() {
            // Implementation in main.js
        }
    </script>
</body>

</html>
