<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge - CTF Security Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <!-- Navbar (same as challenges.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-shield-alt"></i> CTF Security Lab</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/challenges">Challenges</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/docs">Docs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Challenge Header -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <h1 class="display-5 mb-2" id="challengeTitle">
                            <span id="challengeIcon">🎯</span> <span id="challengeName">Loading...</span>
                        </h1>
                        <div class="d-flex gap-2 mb-3">
                            <span class="badge bg-primary" id="challengeCategory">Web</span>
                            <span class="badge bg-warning" id="challengeDifficulty">Medium</span>
                            <span class="badge bg-success" id="challengePoints">200 pts</span>
                        </div>
                    </div>
                    <button class="btn btn-outline-primary" onclick="history.back()">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                </div>
                <p class="lead" id="challengeDescription">Challenge description will appear here...</p>
                
                <div class="mt-3">
                    <h6>Learning Objectives:</h6>
                    <ul id="learningObjectives">
                        <!-- Objectives will be loaded here -->
                    </ul>
                </div>

                <div class="alert alert-info mt-3" id="challengeAlert" style="display: none;">
                    <i class="fas fa-info-circle"></i> <span id="alertMessage"></span>
                </div>
            </div>
        </div>

        <!-- Dynamic Exploit Interface -->
        <div id="exploitInterface">
            <!-- Interface will be dynamically generated based on vulnerability type -->
        </div>

        <!-- Hints Section -->
        <div class="card mt-4">
            <div class="card-header">
                <h5><i class="fas fa-lightbulb"></i> Hints & Resources</h5>
            </div>
            <div class="card-body">
                <div class="accordion" id="hintsAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#hint1">
                                <i class="fas fa-unlock me-2"></i> Hint 1 (Free)
                            </button>
                        </h2>
                        <div id="hint1" class="accordion-collapse collapse" data-bs-parent="#hintsAccordion">
                            <div class="accordion-body" id="hint1Content">
                                <!-- Hint content will be loaded -->
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#hint2">
                                <i class="fas fa-key me-2"></i> Hint 2 (-10 pts)
                            </button>
                        </h2>
                        <div id="hint2" class="accordion-collapse collapse" data-bs-parent="#hintsAccordion">
                            <div class="accordion-body" id="hint2Content">
                                <!-- Hint content will be loaded -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <h6>Recommended Tools:</h6>
                    <div id="toolsList" class="d-flex flex-wrap gap-2">
                        <!-- Tools will be loaded here -->
                    </div>
                </div>

                <div class="mt-4">
                    <h6>References:</h6>
                    <ul id="referencesList">
                        <!-- References will be loaded here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const challengeId = window.location.pathname.split('/').pop();
            loadChallengeDetail(challengeId);
        });

        async function loadChallengeDetail(challengeId) {
            // Load challenge details and generate appropriate exploit interface
            // This will be implemented in main.js
        }
    </script>
</body>
</html>
