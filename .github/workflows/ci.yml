name: CTF Security Lab CI/CD

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock
        pip install playwright
        playwright install chromium
    
    - name: Run linting
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run unit tests with coverage
      env:
        MONGODB_URI: mongodb://localhost:27017/test_ctf
        SECRET_KEY: test_secret_key_for_ci
        GOOGLE_API_KEY: ""  # Empty for tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Security scan with Bandit
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          bandit-report.json
          tests/screenshots/

  build-and-test-ctf:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright pytest-playwright
        playwright install chromium
    
    - name: Start MongoDB
      run: |
        docker run -d -p 27017:27017 --name mongodb mongo:latest
    
    - name: Build CTF Lab
      env:
        MONGODB_URI: mongodb://localhost:27017/test_ctf
        SECRET_KEY: test_build_secret_key
        GOOGLE_API_KEY: ""
      run: |
        # Start FastAPI server in background
        python -c "
        import uvicorn
        from main import app
        import threading
        def run_server():
            uvicorn.run(app, host='127.0.0.1', port=8000, log_level='error')
        thread = threading.Thread(target=run_server, daemon=True)
        thread.start()
        import time
        time.sleep(10)
        " &
        
        # Wait for server to start
        sleep 15
        
        # Test API endpoints
        curl -f http://127.0.0.1:8000/ || echo "API not ready"
    
    - name: Run integration tests
      env:
        MONGODB_URI: mongodb://localhost:27017/test_ctf
        SECRET_KEY: test_build_secret_key
        API_BASE_URL: http://127.0.0.1:8000
      run: |
        pytest tests/test_integration.py -v --screenshots || true
    
    - name: Build Streamlit frontend
      run: |
        # Test Streamlit app can load
        timeout 30 streamlit run frontend_user.py --server.headless true || echo "Streamlit test completed"
    
    - name: Capture screenshots
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: ctf-lab-screenshots
        path: tests/screenshots/
    
    - name: Stop MongoDB
      if: always()
      run: docker stop mongodb || true

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Check for secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --all-files --force-use-all-plugins || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, build-and-test-ctf]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t ctf-security-lab:latest . || echo "Docker build would happen here"
    
    - name: Test Docker image
      run: |
        echo "Docker tests would run here"

  deploy-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy documentation
      run: |
        echo "Documentation deployment would happen here"
        echo "Could use GitHub Pages, ReadTheDocs, etc."
